name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: 📦 Publish to RubyGems
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Sync version dynamically from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not a release tag (expected vX.Y.Z). Run this workflow from a tag."
            exit 1
          fi
          echo "Setting dynamic release version to: $VERSION"
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" lib/smallpict/version.rb
          grep -q "VERSION = \"$VERSION\"" lib/smallpict/version.rb
      - name: Run specs
        run: bundle exec rspec
      - name: Build & Push Gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem build smallpict.gemspec
          gem push smallpict-*.gem
