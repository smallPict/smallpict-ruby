name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  publish:
    name: 📦 Publish to RubyGems
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Sync version dynamically from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not a release tag (expected vX.Y.Z). Run this workflow from a tag."
            exit 1
          fi
          echo "Setting dynamic release version to: $VERSION"
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" lib/smallpict/version.rb
          grep -q "VERSION = \"$VERSION\"" lib/smallpict/version.rb
      - name: Build & Push Gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "${RUBYGEMS_API_KEY}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem build smallpict.gemspec
          gem push smallpict-*.gem
